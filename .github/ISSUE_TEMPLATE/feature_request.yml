name: Feature request
description: A repair or workflow you need
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the recording and the problem, not only the solution.
    validations: { required: true }
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
