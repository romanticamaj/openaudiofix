name: Bug report
description: Something did not work, or a repair sounds wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Upload a 48 kHz stereo WAV\n2. Run Declip\n3. ..."
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version and how you run it
      placeholder: "0.1.0, Docker on macOS"
    validations: { required: true }
  - type: textarea
    id: audio
    attributes:
      label: Audio sample
      description: A few seconds around the problem helps most. Only share audio you have the right to share.
