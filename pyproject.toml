[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openaudiofix"
version = "0.1.0"
description = "Self-hosted audio repair studio: buffer-dropout glitches, clipping, background noise."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "scipy==1.15.3", "soundfile==0.13.1", "onnxruntime==1.20.1"]

[project.optional-dependencies]
server = ["fastapi==0.115.6", "uvicorn==0.34.0", "python-multipart==0.0.20"]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[project.scripts]
afix = "openaudiofix.cli:main"

[tool.setuptools.package-data]
openaudiofix = ["gpu-requirements.txt"]

[tool.setuptools.packages.find]
include = ["openaudiofix*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "private: needs the private v5 regression audio (AFIX_PRIVATE_AUDIO)",
  "slow: takes more than 30 s",
  "docker: needs a running Docker daemon",
]
filterwarnings = [
  # starlette 0.41 TestClient imports an alias that anyio 4.x deprecates (third-party, harmless)
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
